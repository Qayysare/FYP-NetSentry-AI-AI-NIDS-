<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NetSentry AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">
<main class="login-shell">
  <section class="login-card">
    <div class="brand-mark">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1>NetSentry AI</h1>
    <p class="muted">AI-Based Network Intrusion Detection System</p>
    <div class="demo-note">
      <i class="fa-solid fa-circle-info">
      </i> Authorized access only. Sign in with your NetSentry AI account.</div>
    <form id="login-form" novalidate>
      <label for="login-email">Email or username</label><input id="login-email" type="text" placeholder="e.g. admin@ai-nids.local" autocomplete="username">
      <label for="login-password">Password</label>
      <div class="password-field">
        <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password">
        <button type="button" id="password-toggle" aria-label="Show password">
          <i class="fa-solid fa-eye"></i>
        </button> 
      </div>
      <div class="login-options">
        <a href="#" id="forgot-link">Forgot password?</a>
      </div>
      <p id="login-message" class="form-message" aria-live="polite"></p>
      <button class="primary-button" type="submit">Login to dashboard <i class="fa-solid fa-arrow-right"></i></button>
    </form>
  </section></main>
  <script src="js/app.js"></script>
</body>
</html>
